name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: python3 -m unittest discover -s scripts -p "*_test.py"
      - run: bun run test
      - run: bun run check
      - run: bun run format:check
      - run: bun run build
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev clang lld ninja-build pkg-config libglib2.0-dev libpixman-1-dev python3-venv
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: git submodule update --init --depth 1 third_party/qemu
      - name: Build pinned QEMU for the boot smoke test
        run: |
          mkdir -p build/qemu
          cd build/qemu
          ../../third_party/qemu/configure --target-list=aarch64-softmmu --disable-docs --disable-werror --disable-tools --disable-guest-agent
          ninja qemu-system-aarch64
      - name: Boot generated Arm virt hello world
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib generated_hello_world_boots_and_stops -- --ignored --nocapture
